openapi: 3.0.3
info:
  title: Recursive
  version: 1.0.0
paths:
  /tree:
    get:
      operationId: getTree
      responses:
        "200":
          description: A tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
components:
  schemas:
    Node:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The node identifier
        # Direct self-reference: the generator has to stop here. The recursive
        # properties are optional because libopenapi rejects a document whose
        # cycle runs through a required field — an infinite circular reference
        # is a spec error, and only the resolvable form is worth generating for.
        parent:
          $ref: "#/components/schemas/Node"
        # Indirect self-reference, through an array.
        children:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Node"
