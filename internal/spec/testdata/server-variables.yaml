openapi: 3.0.3
info:
  title: Server Variables
  version: 1.0.0
servers:
  - url: https://{region}.api.example.com/{version}
    variables:
      region:
        default: eu
        enum:
          - eu
          - us
      version:
        default: v1
  - url: https://backup.example.com/v1
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      responses:
        '200':
          description: A list of pets
