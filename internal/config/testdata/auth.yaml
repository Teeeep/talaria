openapi: 3.0.3
info:
  title: Auth fixture
  version: 1.0.0
servers:
  - url: https://api.example.com
security:
  - bearerAuth: []
paths:
  /bearer:
    get:
      operationId: getBearer
      responses:
        "200":
          description: OK
  /basic:
    get:
      operationId: getBasic
      security:
        - basicAuth: []
      responses:
        "200":
          description: OK
  /header-key:
    get:
      operationId: getHeaderKey
      security:
        - petKey: []
      responses:
        "200":
          description: OK
  /query-key:
    get:
      operationId: getQueryKey
      security:
        - queryKey: []
      responses:
        "200":
          description: OK
  /cookie-key:
    get:
      operationId: getCookieKey
      security:
        - cookieKey: []
      responses:
        "200":
          description: OK
  /both:
    get:
      operationId: getBoth
      security:
        - bearerAuth: []
          petKey: []
      responses:
        "200":
          description: OK
  /oauth-or-bearer:
    get:
      operationId: getOAuthOrBearer
      security:
        - oauth2:
            - "pets:read"
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /oauth-only:
    get:
      operationId: getOAuthOnly
      security:
        - oauth2:
            - "pets:read"
      responses:
        "200":
          description: OK
  /either-key:
    get:
      operationId: getEitherKey
      # Two alternatives talaria can supply both of. Which one it picks may only
      # depend on which credential is actually set.
      security:
        - keyA: []
        - keyB: []
      responses:
        "200":
          description: OK
  /open:
    get:
      operationId: getOpen
      security: []
      responses:
        "200":
          description: OK
  # The schemes talaria cannot speak itself. Each is reachable only through a
  # token the caller brought in $TALARIA_AUTH_BEARER (§5 Auth).
  /oidc-only:
    get:
      operationId: getOIDCOnly
      security:
        - oidc: []
      responses:
        "200":
          description: OK
  /mtls-only:
    get:
      operationId: getMutualTLSOnly
      security:
        - mtls: []
      responses:
        "200":
          description: OK
  /path-key:
    get:
      operationId: getPathKey
      security:
        - pathKey: []
      responses:
        "200":
          description: OK
  /capital-key:
    get:
      operationId: getCapitalKey
      security:
        - capitalKey: []
      responses:
        "200":
          description: OK
  /undeclared:
    get:
      operationId: getUndeclared
      # Names a scheme components.securitySchemes never declares: a broken spec,
      # not a missing credential.
      security:
        - ghostScheme: []
      responses:
        "200":
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    basicAuth:
      type: http
      scheme: basic
    petKey:
      type: apiKey
      in: header
      name: X-Pet-Key
    queryKey:
      type: apiKey
      in: query
      name: api_key
    cookieKey:
      type: apiKey
      in: cookie
      name: session
    keyA:
      type: apiKey
      in: header
      name: X-A
    keyB:
      type: apiKey
      in: header
      name: X-B
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.example.com/token
          scopes:
            "pets:read": read pets
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://api.example.com/.well-known/openid-configuration
    mtls:
      type: mutualTLS
    pathKey:
      # `path` is not a place a request carries a credential.
      type: apiKey
      in: path
      name: key
    capitalKey:
      # OpenAPI fixes `in` as lowercase; this one is malformed on purpose.
      type: apiKey
      in: Header
      name: X-Capital
