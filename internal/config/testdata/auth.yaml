openapi: 3.0.3
info:
  title: Auth fixture
  version: 1.0.0
servers:
  - url: https://api.example.com
security:
  - bearerAuth: []
paths:
  /bearer:
    get:
      operationId: getBearer
      responses:
        "200":
          description: OK
  /basic:
    get:
      operationId: getBasic
      security:
        - basicAuth: []
      responses:
        "200":
          description: OK
  /header-key:
    get:
      operationId: getHeaderKey
      security:
        - petKey: []
      responses:
        "200":
          description: OK
  /query-key:
    get:
      operationId: getQueryKey
      security:
        - queryKey: []
      responses:
        "200":
          description: OK
  /cookie-key:
    get:
      operationId: getCookieKey
      security:
        - cookieKey: []
      responses:
        "200":
          description: OK
  /both:
    get:
      operationId: getBoth
      security:
        - bearerAuth: []
          petKey: []
      responses:
        "200":
          description: OK
  /oauth-or-bearer:
    get:
      operationId: getOAuthOrBearer
      security:
        - oauth2:
            - "pets:read"
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /oauth-only:
    get:
      operationId: getOAuthOnly
      security:
        - oauth2:
            - "pets:read"
      responses:
        "200":
          description: OK
  /either-key:
    get:
      operationId: getEitherKey
      # Two alternatives talaria can supply both of. Which one it picks may only
      # depend on which credential is actually set.
      security:
        - keyA: []
        - keyB: []
      responses:
        "200":
          description: OK
  /oidc-only:
    get:
      operationId: getOIDCOnly
      security:
        - openIdConnect: []
      responses:
        "200":
          description: OK
  /mtls-only:
    get:
      operationId: getMutualTLSOnly
      security:
        - mutualTLS: []
      responses:
        "200":
          description: OK
  /body-key-only:
    get:
      operationId: getBodyKeyOnly
      security:
        - bodyKey: []
      responses:
        "200":
          description: OK
  /undeclared:
    get:
      operationId: getUndeclared
      # The requirement names a scheme components.securitySchemes does not
      # declare: a broken spec, not a missing credential.
      security:
        - ghostKey: []
      responses:
        "200":
          description: OK
  /open:
    get:
      operationId: getOpen
      security: []
      responses:
        "200":
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    basicAuth:
      type: http
      scheme: basic
    petKey:
      type: apiKey
      in: header
      name: X-Pet-Key
    queryKey:
      type: apiKey
      in: query
      name: api_key
    cookieKey:
      type: apiKey
      in: cookie
      name: session
    keyA:
      type: apiKey
      in: header
      name: X-A
    keyB:
      type: apiKey
      in: header
      name: X-B
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.example.com/token
          scopes:
            "pets:read": read pets
    openIdConnect:
      type: openIdConnect
      openIdConnectUrl: https://api.example.com/.well-known/openid-configuration
    mutualTLS:
      type: mutualTLS
    # An API key in a place a request does not have. Unsupported for a
    # different reason from oauth2, and it must behave the same way.
    bodyKey:
      type: apiKey
      in: body
      name: api_key
